{% extends "base.html" %}
{% block content %}

<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold">
    <a href="/" class="text-gray-400 hover:text-gray-600">←</a>

<div id="flows" class="space-y-4"></div>
{% endblock %}

{% block scripts %}

<script src="/static/js/campaign.js"></script>
{% endblock %}
